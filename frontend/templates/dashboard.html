<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Document Intelligence Platform</title>
  <link rel="stylesheet" href="/static/css/style.css" />
</head>
<body>
  <header>
    <div class="brand">
      <span class="brand-mark">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="4" y="3" width="16" height="18" rx="1" stroke="#B8874B" stroke-width="1.4"/>
          <line x1="7.5" y1="8" x2="16.5" y2="8" stroke="#B8874B" stroke-width="1.2"/>
          <line x1="7.5" y1="12" x2="16.5" y2="12" stroke="#B8874B" stroke-width="1.2"/>
          <line x1="7.5" y1="16" x2="13" y2="16" stroke="#B8874B" stroke-width="1.2"/>
        </svg>
      </span>
      <div>
        <h1>Document Intelligence Platform</h1>
        <span class="tagline">Extraction &amp; financial validation for invoices &amp; statements</span>
      </div>
    </div>
    <a class="docs-link" href="/docs" target="_blank">API Docs (Swagger) →</a>
  </header>

  <main>
    <section class="panel">
      <h2 class="section-title">Upload a document</h2>
      <p class="section-subtitle">PDF, JPG, or PNG — up to 3 pages.</p>
      <div class="upload-row">
        <select id="documentType" aria-label="Document type">
          <option value="invoice">Invoice</option>
          <option value="balance_sheet">Balance Sheet</option>
          <option value="profit_and_loss">Profit &amp; Loss</option>
          <option value="cash_flow_statement">Cash Flow Statement</option>
        </select>
        <input type="file" id="fileInput" accept=".pdf,.jpg,.jpeg,.png" aria-label="Choose file" />
        <button id="processBtn">Process Document</button>
      </div>
      <div id="uploadStatus"></div>
    </section>

    <section class="panel">
      <h2 class="section-title">Processed Documents</h2>
      <table>
        <thead>
          <tr>
            <th>Document Name</th>
            <th>Type</th>
            <th>Status</th>
            <th>Confidence</th>
            <th>Processed At</th>
          </tr>
        </thead>
        <tbody id="docTableBody">
          <tr class="empty-row"><td colspan="5">Loading…</td></tr>
        </tbody>
      </table>
    </section>
  </main>

  <script src="/static/js/dashboard.js"></script>
</body>
</html>
